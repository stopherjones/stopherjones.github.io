<script>
    (function() {
        // Predefined title overrides for known project repositories
        const projectTitles = {
            'daily-games': 'Daily games',
            'record-collection': 'Record Collection',
            'around-the-world': 'Around the world',
            'media-search': 'Media search',
            'portfolio': 'Portfolio',
            'birds': 'Birds',
            'around-the-world-in-eighty-games': 'Around the world in eighty games',
            'play-around-the-world': 'Play around the world',
            'bga-tournaments': 'BGA tournament tracker'
        };

        const noticeElement = document.getElementById('context-notice');
        
        // Extract path segments, ignoring empty strings (e.g., "/birds/deep/link/" -> ["birds", "deep", "link"])
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const repoSlug = pathSegments[0]; // The first segment after the domain is always the repository name

        if (repoSlug) {
            const slugLower = repoSlug.toLowerCase();
            
            // Use known title or automatically format slug (e.g. "my-cool-project" -> "My Cool Project")
            const projectTitle = projectTitles[slugLower] || 
                repoSlug.replace(/-/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
            
            const projectUrl = `https://stopherjones.github.io/${repoSlug}/`;

            noticeElement.innerHTML = `<p>It looks like you were looking for a page inside <strong>${projectTitle}</strong>. You can return to the <a href="${projectUrl}"><strong>${projectTitle} main page</strong></a> or select another project below.</p>`;
        }
    })();
</script>
